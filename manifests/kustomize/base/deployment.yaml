apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-operator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    spec:
      enableServiceLinks: false
      containers:
        - name: redis-operator
          image: ghcr.io/buildio/redis-operator:4.2.0-rc2
          imagePullPolicy: IfNotPresent
          env:
            # The Redis pods run an init container that copies the
            # redis-instance binary out of this image, so the operator must
            # know its own image. Keep this in step with image above.
            - name: OPERATOR_IMAGE
              value: ghcr.io/buildio/redis-operator:4.2.0-rc2
            - name: OPERATOR_IMAGE_PULL_POLICY
              value: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: Always
